<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Repository Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="bg-decor" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
    </div>

    <div class="shell">

        <header class="topbar">

            <div class="brand">
                <span class="brand-mark">R</span>
                <span class="brand-text">Repo<strong>Gen</strong></span>
            </div>

            <button
                id="theme-toggle"
                class="theme-toggle"
                type="button"
                aria-label="Toggle color theme"
                title="Toggle color theme"
            >
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
                </svg>
            </button>

        </header>

        <p class="lede">
            Generate APT repository configuration for Debian-based distributions.
        </p>

        <div class="layout">

            <aside class="panel form-panel">

                <div class="panel-label">Configuration</div>

                <label for="mirror">
                    Mirror
                </label>

                <select id="mirror"></select>

                <input
                    type="text"
                    id="mirror-custom"
                    class="hidden"
                    placeholder="e.g. mirror.example.org"
                    autocomplete="off"
                >

                <label for="release">
                    Release
                </label>

                <select id="release"></select>

                <label>
                    Components
                </label>

                <div
                    id="components"
                    class="checkbox-group"
                ></div>

                <label>
                    Suites
                </label>

                <div
                    id="suites"
                    class="checkbox-group"
                ></div>

                <label for="format">
                    Format
                </label>

                <select id="format">

                    <option value="sources.list">
                        sources.list
                    </option>

                    <option value="debian.sources">
                        debian.sources
                    </option>

                </select>

                <button id="generate">
                    Generate
                </button>

            </aside>

            <section class="panel main-panel">

                <div id="distro-info" class="distro-info hidden">

                    <div class="distro-info-head">

                        <div class="distro-avatar" id="distro-avatar">?</div>

                        <div>
                            <div class="distro-eyebrow">Selected distribution</div>
                            <h3 id="distro-title">—</h3>
                        </div>

                    </div>

                    <div id="distro-desc" class="distro-desc"></div>

                    <div id="distro-tags" class="distro-tags"></div>

                </div>

                <div class="result-head">

                    <h2>Generated Configuration</h2>

                    <div class="actions">

                        <button id="copy" type="button">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
                                <rect x="9" y="9" width="12" height="12" rx="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            Copy
                        </button>

                        <button id="download" type="button">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
                                <path d="M12 3v12m0 0-4-4m4 4 4-4"></path>
                                <path d="M4 19h16"></path>
                            </svg>
                            Download
                        </button>

                    </div>

                </div>

                <pre id="output"></pre>

            </section>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
